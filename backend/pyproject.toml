[project]
name = "study-copilot-backend"
version = "0.1.0"
description = "Local RAG study copilot backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "sentence-transformers>=3.2",
    "anthropic>=0.39",
    "pathspec>=0.12",
    "charset-normalizer>=3.4",
    "numpy>=1.26,<2.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
code-chunking = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
